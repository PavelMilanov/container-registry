name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          FILE_VERSION="$(cat version)"
          if [[ ! "${FILE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version file has invalid format: ${FILE_VERSION}"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME}"
            if [[ ! "${TAG_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag has invalid format: ${TAG_VERSION}"
              exit 1
            fi
            if [[ "${FILE_VERSION}" != "${TAG_VERSION}" ]]; then
              echo "Version mismatch: version=${FILE_VERSION}, tag=${TAG_VERSION}"
              exit 1
            fi
            VERSION="${TAG_VERSION}"
          else
            VERSION="${FILE_VERSION}"
          fi

          MAJOR="$(echo "${VERSION}" | cut -d. -f1)"
          MINOR="$(echo "${VERSION}" | cut -d. -f1-2)"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major=${MAJOR}" >> "${GITHUB_OUTPUT}"
          echo "minor=${MINOR}" >> "${GITHUB_OUTPUT}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_LOGIN }}
          password: ${{ secrets.DOCKER_REGISRTY_PWD }}

      - name: Build and push vX.Y.Z + latest
        run: make push version=${{ steps.version.outputs.version }}

      - name: Publish additional tags (vX.Y, vX)
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="rosomilanov/container-registry"
          VERSION="${{ steps.version.outputs.version }}"
          MINOR="${{ steps.version.outputs.minor }}"
          MAJOR="${{ steps.version.outputs.major }}"

          docker pull "${IMAGE}:${VERSION}"
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:${MINOR}"
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:${MAJOR}"
          docker push "${IMAGE}:${MINOR}"
          docker push "${IMAGE}:${MAJOR}"

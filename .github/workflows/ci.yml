name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "vagrant/**"
      - "README.md"
      - "Dockerfile"
      - "Makefile"
      - "docs/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: cd src && go mod download

      - name: Run tests
        run: cd src && go test -v ./...
